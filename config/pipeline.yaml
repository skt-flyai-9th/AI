timezone: Asia/Seoul
now: null

paths:
  candidates_csv: data/candidates.auto.csv
  observations_csv: data/observations.csv
  database: data/challenge_ranker.sqlite3
  output_dir: output

# 사용자는 후보 챌린지를 입력하지 않습니다.
# Instagram/Apify를 후보 발견의 중심으로 두고, Gemini가 후보를 군집화합니다.
auto_discovery:
  enabled: true
  gemini_api_key_env: GEMINI_API_KEY
  youtube_api_key_env: YOUTUBE_API_KEY
  model: auto

  # 최종 Top 100을 안정적으로 만들기 위해 후보 풀은 더 넓게 확보합니다.
  max_candidates: 200
  min_candidate_confidence: 0.12
  max_evidence_records: 2600
  ai_chunk_size: 60

  instagram_apify:
    required: false
    api_token_env: APIFY_API_TOKEN
    search_limit_per_seed: 50
    max_seed_runs: 30
    max_expansion_runs: 30
    expansion_search_limit: 40
    timeout_seconds: 240
    expand_from_hashtags: true
    max_expansion_terms: 60
    seed_queries:
      - 챌린지
      - 댄스
      - 춤
      - 댄스챌린지
      - 릴스
      - 유행
      - 요즘유행
      - 밈
      - 밈챌린지
      - 포즈
      - 사진포즈
      - 손댄스
      - 손동작
      - 안무
      - 커플
      - 커플릴스
      - 친구
      - 친구릴스
      - 변신
      - 전환
      - 메이크업
      - 메이크업챌린지
      - 립싱크
      - 표정
      - KPOP
      - 케이팝
      - dancechallenge
      - challenge
      - reelschallenge
      - choreography

  # Instagram이 완전히 실패할 때만 degraded discovery 용도입니다.
  youtube:
    lookback_days: 10
    max_results_per_query: 20
    max_search_requests: 1
    viewcount_seed_count: 0
    region_code: KR
    relevance_language: ko
    seed_queries: []
    fallback_when_instagram_empty: true
    fallback_max_search_requests: 10
    fallback_viewcount_seed_count: 1
    fallback_seed_queries:
      - 댄스 챌린지
      - 유행 챌린지
      - 밈 챌린지
      - 포즈 챌린지
      - KPOP 챌린지

  naver:
    client_id_env: NAVER_API_HUB_CLIENT_ID
    client_secret_env: NAVER_API_HUB_CLIENT_SECRET
    display: 80
    sources: [blog, news]
    seed_queries:
      - 챌린지
      - 댄스 챌린지
      - 유행 챌린지
      - SNS 챌린지
      - 릴스 챌린지

# 최종 판정에서는 명백한 비-챌린지만 false로 처리합니다.
# 애매하지만 참여형 가능성이 있는 후보는 true + 낮은 score/evidence로 남깁니다.
ai_adjudication:
  enabled: true
  gemini_api_key_env: GEMINI_API_KEY
  model: auto
  max_candidates: 200
  batch_size: 30
  weight: 0.18

sources:
  observations:
    enabled: false

  # 발견된 후보를 Instagram에서 재검증합니다.
  instagram_apify:
    enabled: true
    api_token_env: APIFY_API_TOKEN
    hashtag_actor_id: apify~instagram-hashtag-scraper
    results_per_challenge: 12
    max_terms_per_challenge: 2
    max_challenges: 160
    timeout_seconds: 240

  # 중요: Instagram/NAVER 사전 점수로 provisional Top 100을 만든 뒤,
  # 그 100개에 대해서만 search.list를 1회씩 최대 100회 사용합니다.
  # 한 번의 검색에서 최대 50개 영상을 받아 대표/가이드 영상 모두 선정합니다.
  youtube:
    enabled: true
    api_key_env: YOUTUBE_API_KEY
    lookback_days: 365
    max_aliases_per_challenge: 3
    max_results_per_challenge: 50
    # Final output is 11 new trends. Search a bounded reserve pool so candidates
    # without a usable URL can be retried or replaced without returning <11.
    max_search_requests: 33
    max_challenges: 33
    search_attempts_per_challenge: 3
    max_duration_seconds: 900
    region_code: KR
    relevance_language: ko

  naver_datalab:
    enabled: true
    client_id_env: NAVER_API_HUB_CLIENT_ID
    client_secret_env: NAVER_API_HUB_CLIENT_SECRET
    lookback_days: 42
    exclude_current_day: true
    recent_days: 3
    previous_days: 3
    baseline_days: 28

  naver_blog:
    enabled: true
    client_id_env: NAVER_API_HUB_CLIENT_ID
    client_secret_env: NAVER_API_HUB_CLIENT_SECRET
    pages_per_challenge: 1
    display: 100
    max_aliases_per_challenge: 2
    query_suffix: 챌린지

  naver_news:
    enabled: true
    client_id_env: NAVER_API_HUB_CLIENT_ID
    client_secret_env: NAVER_API_HUB_CLIENT_SECRET
    pages_per_challenge: 1
    display: 100
    query_suffix: 챌린지

  x:
    enabled: false

# YouTube 후보 영상 한 세트에서 두 목적을 별도로 최적화합니다.
representative_youtube:
  enabled: true
  gemini_api_key_env: GEMINI_API_KEY
  model: auto
  ai_participation_check: true
  max_ai_videos_per_challenge: 10
  max_ai_challenges_per_run: 100
  ai_batch_challenges: 12
  minimum_relevance: 0.32
  fallback_enabled: true
  fallback_minimum_relevance: 0.14
  recency_half_life_days: 35
  paid_penalty: 0.08

  # 1) 앱 화면 대표 영상: 유명한/조회수 높은 실제 챌린지 영상 가중치가 가장 큼.
  representative_weights:
    relevance: 0.25
    participation: 0.10
    popularity: 0.45
    recency: 0.05
    engagement: 0.05
    kr_affinity: 0.10

  # 2) 따라하기 가이드 영상: 안무/튜토리얼/거울모드/연습/명확한 시범을 가장 크게 평가.
  guide_weights:
    relevance: 0.20
    guideability: 0.45
    participation: 0.10
    popularity: 0.05
    recency: 0.05
    engagement: 0.05
    kr_affinity: 0.10

ranking:
  top_n: 11
  require_youtube_video: true
  exclude_challenge_ids:
    - jujutsu_transition
    - donggeurio_challenge
    - otsukare_summer_challenge
    - doma_bad_challenge
  exclude_ai_rejected: true
  backfill_to_top_n: true
  backfill_min_entity_confidence: 0.15
  confidence_floor_multiplier: 0.55
  emerging_weights:
    participation_acceleration: 0.27
    kr_creator_growth: 0.20
    creator_diversity: 0.14
    cross_platform: 0.14
    search_lift: 0.10
    freshness: 0.10
    participation_conversion: 0.05
  mainstream_weights:
    unique_creators: 0.27
    reach: 0.18
    persistence: 0.15
    cross_platform: 0.14
    spillover: 0.10
    creator_diversity: 0.10
    organic_breadth: 0.06
  seeded_penalty_max: 15.0
