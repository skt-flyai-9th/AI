[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flyai-ai-service"
version = "1.4.0"
description = "Independent FastAPI AI service with trend, shortform, and editing agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "celery[redis]>=5.4,<6.0",
  "redis>=5.0,<7.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "orjson>=3.10,<4.0",
  "typer>=0.15,<1.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "requests>=2.32,<3.0",
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pillow>=10.4,<13.0",
  "fonttools>=4.53,<5.0",
  "psutil>=5.9,<8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
ai-service = "app.cli:app"
challenge-ranker-api = "app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["alembic/versions", "reals-video-engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  "B008",
  "B007",
  "E701",
  "E702",
  "I001",
  "UP017",
  "UP035",
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
"app/ranker_core/*.py" = ["F401", "F841"]
"app/ranker_core/connectors/*.py" = ["F401", "F841"]
"app/services/pipeline.py" = ["F401"]
