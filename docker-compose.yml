services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: challenge
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d challenge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  renderer:
    build: .
    command: uvicorn app.renderer.main:app --host 0.0.0.0 --port 8080
    # Uvicorn drains in-flight requests on SIGTERM. Give an active render the
    # same upper bound as the editing task before Compose may force-kill it.
    stop_grace_period: 40m
    env_file: .env
    environment:
      RUN_DB_MIGRATIONS: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./runtime-data:/app/runtime-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  initializer:
    build: .
    command: ai-service initialize-once
    env_file: .env
    volumes:
      - ./runtime-data:/app/runtime-data
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      RUN_DB_MIGRATIONS: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./runtime-data:/app/runtime-data
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      renderer:
        condition: service_healthy
      initializer:
        condition: service_completed_successfully

  worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    # Celery performs a warm shutdown on SIGTERM. Deployments must not turn a
    # valid in-flight edit into a renderer/network failure after ten seconds.
    stop_grace_period: 40m
    env_file: .env
    environment:
      RUN_DB_MIGRATIONS: "false"
    volumes:
      - ./runtime-data:/app/runtime-data
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      renderer:
        condition: service_healthy
      initializer:
        condition: service_completed_successfully

  beat:
    build: .
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      RUN_DB_MIGRATIONS: "false"
    volumes:
      - ./runtime-data:/app/runtime-data
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      initializer:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
