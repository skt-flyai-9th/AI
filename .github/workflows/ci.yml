name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./runtime-data/test.db
          CELERY_TASK_ALWAYS_EAGER: "true"
      - name: Validate Docker Compose
        run: cp .env.example .env && docker compose config --quiet
      - name: Build service image
        run: docker build --tag flyai-ai-service:test .
      - name: Verify REALS renderer image readiness
        run: >-
          docker run --rm --entrypoint python flyai-ai-service:test -c
          "from app.renderer.service import RealsRendererService;
          status = RealsRendererService().ready();
          assert status['ready'], status"
