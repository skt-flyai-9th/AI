name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./runtime-data/test.db
          CELERY_TASK_ALWAYS_EAGER: "true"
      - name: Validate Docker Compose
        run: cp .env.example .env && docker compose config --quiet
      - name: Build service image
        run: docker build --tag flyai-ai-service:test .
      - name: Verify REALS renderer image readiness
        run: >-
          docker run --rm --entrypoint python flyai-ai-service:test -c
          "from app.renderer.service import RealsRendererService;
          status = RealsRendererService().ready();
          assert status['ready'], status"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flyai
          POSTGRES_PASSWORD: flyai
          POSTGRES_DB: flyai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyai -d flyai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://flyai:flyai@localhost:5432/flyai_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CELERY_TASK_ALWAYS_EAGER: "true"
      INTERNAL_API_KEY: test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Verify Redis connectivity
        run: python -c "import redis; assert redis.Redis.from_url('redis://localhost:6379/0').ping()"
      - name: Run database and cross-endpoint integration tests
        run: >-
          pytest
          tests/test_template_knowledge.py
          tests/test_challenge_api.py
          tests/test_editing_agent.py
          tests/test_health.py
