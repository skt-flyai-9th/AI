name: Bootstrap FastAPI challenge ranker

on:
  workflow_dispatch:
  push:
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-fastapi-main
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/flyai-challenge-ranker-api.tar.gz.b64
          base64 --decode /tmp/flyai-challenge-ranker-api.tar.gz.b64 > /tmp/flyai-challenge-ranker-api.tar.gz
          echo "df82ac8232cb0f2c15aac0ad2fda494f37f912d07229966f1733b437fde0e574  /tmp/flyai-challenge-ranker-api.tar.gz" | sha256sum --check --strict

      - name: Install FastAPI project into repository root
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/flyai-challenge-ranker-api.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add FastAPI challenge ranking service"
          git push origin HEAD:main
